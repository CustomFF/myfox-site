:root {
  --page: #f4f3f0; --text: #212121; --muted: #5f6368;
  --accent: #0a84ff; --on-accent: #ffffff;
  --r: 5px;
  --f: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #2a2d30; --text: #d6d7d7; --muted: #a5a9ae;
    --accent: #4dabff; --on-accent: #0b1a2a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #2a2d30; --text: #d6d7d7; --muted: #a5a9ae;
  --accent: #4dabff; --on-accent: #0b1a2a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html[data-lang="ru"] body [lang="en"],
html[data-lang="en"] body [lang="ru"] { display: none !important; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; overflow: hidden;
  display: grid; align-items: center;
  background: var(--page); color: var(--text);
  font: 16px/1.6 var(--f);
  -webkit-font-smoothing: antialiased;
}
/* The cat from the site, huge and blurred, behind the text. */
.cat {
  position: fixed; left: 50%; top: 50%; z-index: 0;
  height: 115vh; width: auto; max-width: none;
  transform: translate(-88%, -50%) rotate(-8deg);
  filter: blur(24px) brightness(0); opacity: .08;
  pointer-events: none;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cat { filter: blur(24px); } }
:root[data-theme="dark"] .cat { filter: blur(24px); }
main {
  position: relative; z-index: 1;
  width: min(100% - 32px, 960px); margin-inline: auto;
  display: grid; gap: 20px; justify-items: start;
}
h1 { margin: 0; font: 800 clamp(48px, 25.6px + 6vw, 112px)/1 var(--f); letter-spacing: -.04em; }
p { margin: 0; font-size: clamp(18.4px, 14.4px + .9vw, 27.2px); line-height: 1.4; max-width: 34ch; }
.go {
  display: inline-flex; align-items: center; height: 36px; padding: 0 16px; margin-top: 8px;
  border: 0; border-radius: var(--r);
  background: var(--accent); color: var(--on-accent);
  font: 600 16px/1 var(--f); text-decoration: none; cursor: pointer;
}
.go:hover { filter: brightness(1.08); }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; border-radius: var(--r); }
</style>
